<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF9F4" />
    <title>Stash</title>

    <!-- Brand favicon + app icons (from the logo kit) -->
    <link rel="icon" type="image/svg+xml" href="logo/app-icon/stash-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="logo/png/stash-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="logo/png/stash-favicon-16.png" />
    <link rel="apple-touch-icon" href="logo/png/stash-icon-ink-180.png" />

    <!-- Poppins — the brand typeface, weights 300/400/500/700 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="screen">
      <!-- ---------- Top bar: logo + theme toggle ---------- -->
      <header class="topbar">
        <!-- The horizontal lockup is the default logo. We show the
             reversed (light) version in dark mode via CSS. -->
        <img
          class="topbar__logo topbar__logo--light"
          src="logo/svg/stash-lockup-horizontal.svg"
          alt="Stash"
          height="28"
        />
        <img
          class="topbar__logo topbar__logo--dark"
          src="logo/svg/stash-lockup-horizontal-reversed.svg"
          alt="Stash"
          height="28"
        />

        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
        </button>
      </header>

      <!-- ---------- Hero: the balance is the loudest thing ---------- -->
      <section class="hero" aria-labelledby="balance-label">
        <p id="balance-label" class="hero__label">Your stash</p>
        <p class="hero__balance">
          <span id="balance">0</span>
          <span class="hero__unit">points</span>
        </p>

        <!-- The tally counter. JavaScript fills this with bundles of five. -->
        <div id="tally" class="tally" role="img" aria-label="0 points"></div>

        <p id="hero-hint" class="hero__hint"></p>
      </section>

      <!-- ---------- Today's tasks ---------- -->
      <section class="tasks" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading" class="section-heading">Today</h2>
        <ul id="task-list" class="task-list"></ul>
        <p id="tasks-empty" class="empty-state" hidden>
          Nothing left for today. Nice work.
        </p>
      </section>

      <!-- ---------- Footer: demo helper ---------- -->
      <footer class="footer">
        <p class="footer__note">
          Tap <strong>Do</strong> to learn a chore and do it, then a parent taps
          <strong>✓</strong> to verify. Points are only added once a parent verifies.
        </p>
        <button id="reset" class="text-button" type="button">Reset demo</button>
      </footer>
    </div>

    <!-- ---------- The "Do" overlay: learn, then a timer ----------
         JavaScript fills in the chore name, steps and timer. -->
    <div id="overlay" class="overlay" hidden>
      <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheet-title"
      >
        <button id="sheet-close" class="sheet__close" type="button" aria-label="Close">
          ×
        </button>

        <!-- Phase 1: learn how to do the chore -->
        <div id="phase-learn" class="phase">
          <p class="sheet__eyebrow">How to do it</p>
          <h2 id="sheet-title" class="sheet__title"></h2>
          <p id="step-counter" class="sheet__counter"></p>
          <p id="step-text" class="sheet__step"></p>
          <div id="step-dots" class="dots" aria-hidden="true"></div>
          <button id="step-next" class="btn btn--primary btn--block" type="button">
            Next
          </button>
          <button id="step-back" class="text-button" type="button">Back</button>
        </div>

        <!-- Phase 2: the timer, while the child does the real chore -->
        <div id="phase-do" class="phase" hidden>
          <p class="sheet__eyebrow">Now go and do it</p>
          <h2 id="do-title" class="sheet__title"></h2>
          <div id="timer" class="timer">0:00</div>
          <div class="timer-bar" aria-hidden="true">
            <div id="timer-fill" class="timer-bar__fill"></div>
          </div>
          <p id="timer-hint" class="sheet__hint">
            Off you go. Tap “I’ve done it” when you’re finished.
          </p>
          <button id="do-done" class="btn btn--primary btn--block" type="button">
            I’ve done it
          </button>
        </div>
      </div>
    </div>

    <!-- Small message that appears when points are earned -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="script.js"></script>
  </body>
</html>
